<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drop — Labs OS</title>
<style>
  :root{
    --bg:#f8f8f7; --card:#ffffff; --card-2:#f4f4f2; --border:#e8e7e3; --border-2:#dedcd6;
    --ink:#191918; --body:#3f3f3c; --muted:#84837d;
    --accent:#996c1f; --accent-ink:#7a5416; --accent-bg:rgba(153,108,31,.08);
    --good:#188351; --bad:#cc3f2f; --bad-bg:rgba(204,63,47,.08);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Inter","Helvetica Neue",Arial,sans-serif;
    --nav-h:60px; --r:12px; --r-s:8px;
    --shadow:0 1px 2px rgba(25,25,24,.04);
    --shadow-lg:0 8px 32px rgba(25,25,24,.12);
    --ease:cubic-bezier(.25,.6,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111113; --card:#1a1a1d; --card-2:#212124; --border:#2a2a2e; --border-2:#37373c;
      --ink:#f2f2f0; --body:#c9c9c4; --muted:#8b8b86;
      --accent:#d8a94c; --accent-ink:#e5be6e; --accent-bg:rgba(216,169,76,.10);
      --good:#3fc380; --bad:#ef6b5b; --bad-bg:rgba(239,107,91,.10);
      --shadow:0 1px 2px rgba(0,0,0,.2);
      --shadow-lg:0 12px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
  a{color:inherit;text-decoration:none;}
  .num{font-variant-numeric:tabular-nums}
  svg{display:block;}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 90px);}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px;}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .brand-dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}
  .brand-name{font-weight:700;font-size:15px;color:var(--ink);}
  .brand-name span{color:var(--muted);font-weight:500;}
  .top-spacer{flex:1;}
  .iconbtn{width:38px;height:38px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;
    color:var(--muted);border:1px solid transparent;transition:all .15s var(--ease);}
  .iconbtn:hover{background:var(--card-2);color:var(--ink);}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.on{color:var(--accent);background:var(--accent-bg);}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:8px;padding:2px 0 12px;flex-wrap:wrap;}
  .crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap;}
  .crumbs::-webkit-scrollbar{display:none;}
  .crumb{font-size:14.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:7px;flex:0 0 auto;}
  .crumb:hover{background:var(--card-2);color:var(--ink);}
  .crumb.here{color:var(--ink);}
  .crumb-sep{color:var(--border-2);flex:0 0 auto;}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--card);
    color:var(--ink);font-size:13px;font-weight:600;border-radius:var(--r-s);padding:8px 13px;
    transition:all .15s var(--ease);box-shadow:var(--shadow);flex:0 0 auto;}
  .btn:hover{border-color:var(--border-2);}
  .btn:active{transform:scale(.96);}
  .btn .ic{width:16px;height:16px;}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}

  .searchrow{padding:0 0 12px;}
  .srch-meta{font-size:12px;color:var(--muted);padding:6px 2px 0;}
  #srchresults .card{cursor:pointer;}
  #q{font-family:var(--sans);font-size:14px;border:1px solid var(--border);border-radius:var(--r-s);
    background:var(--card);color:var(--ink);padding:9px 12px;width:100%;}
  #q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}

  /* category filter chips */
  .catbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px;}
  .catbar:empty{display:none;}
  .catbar::-webkit-scrollbar{display:none;}
  .cat{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;border-radius:999px;
    padding:6px 12px;cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;}
  .cat:hover{color:var(--ink);}
  .cat.on{background:var(--accent-bg);border-color:transparent;color:var(--accent);}
  .cat .ic{width:14px;height:14px;}
  .cat small{opacity:.65;font-weight:600;}

  /* folders */
  .folders{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px;}
  .folder{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);transition:all .15s var(--ease);max-width:100%;}
  .folder:hover{border-color:var(--border-2);}
  .folder:active{transform:scale(.97);}
  .folder{cursor:pointer;}
  .folder .ic{width:18px;height:18px;color:var(--accent);flex:0 0 auto;}
  .folder b{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .folder small{font-size:11.5px;color:var(--muted);flex:0 0 auto;}
  .fdots{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);flex:0 0 auto;margin-left:2px;}
  .fdots:hover{background:var(--card-2);color:var(--ink);}
  .fdots .ic{width:15px;height:15px;color:inherit;}

  /* file grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--shadow);transition:all .15s var(--ease);cursor:pointer;}
  .card:hover{border-color:var(--border-2);box-shadow:var(--shadow-lg);}
  .card:active{transform:scale(.97);}
  .card .pv{position:relative;aspect-ratio:4/3;background:var(--card-2);display:flex;align-items:center;
    justify-content:center;color:var(--muted);}
  .card .pv img{width:100%;height:100%;object-fit:cover;}
  .card .pv .ic{width:34px;height:34px;stroke-width:1.4;}
  .card .badge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;
    padding:3px 7px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .card .badge .ic{width:10px;height:10px;stroke-width:2.4;fill:#fff;stroke:none;}
  .card .meta{padding:9px 11px;}
  .card .nm{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .card .dots{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;
    background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s;}
  .card:hover .dots{opacity:1;}
  .card .dots .ic{width:16px;height:16px;stroke-width:2.4;}
  @media (hover:none){.card .dots{opacity:1;background:rgba(0,0,0,.35);}}

  /* list view */
  .list .grid{display:block;}
  .list .card{display:flex;align-items:center;gap:12px;border-radius:10px;margin-bottom:6px;padding:8px 10px;}
  .list .card .pv{aspect-ratio:auto;width:46px;height:46px;border-radius:8px;flex:0 0 auto;overflow:hidden;}
  .list .card .pv .ic{width:20px;height:20px;}
  .list .card .badge{display:none;}
  .list .card .meta{flex:1;min-width:0;padding:0;}
  .list .card .dots{position:static;opacity:1;background:transparent;color:var(--muted);}

  /* empty / loading */
  .empty{border:2px dashed var(--border-2);border-radius:16px;padding:56px 24px;text-align:center;margin-top:8px;}
  .empty .ic{width:44px;height:44px;margin:0 auto 12px;color:var(--muted);stroke-width:1.3;}
  .empty h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
  .empty p{margin:0;font-size:13.5px;color:var(--muted);}
  .skel{height:120px;border-radius:var(--r);background:linear-gradient(100deg,var(--card-2) 40%,var(--card) 50%,var(--card-2) 60%);
    background-size:200% 100%;animation:sk 1.2s infinite linear;}
  @keyframes sk{to{background-position:-200% 0}}

  /* FAB */
  .fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 18px);z-index:55;
    display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;
    border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(153,108,31,.4);transition:transform .15s var(--ease);}
  .fab:active{transform:scale(.93);}
  .fab .ic{width:19px;height:19px;stroke-width:2.2;}
  @media (prefers-color-scheme: dark){.fab{color:#17130a;box-shadow:0 8px 24px rgba(0,0,0,.5);}}

  /* app nav */
  .appnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--card);
    border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 20px rgba(0,0,0,.06);}
  .appitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:8px 4px;min-height:var(--nav-h);color:var(--muted);font-size:10.5px;font-weight:600;}
  .appitem .ic{width:21px;height:21px;}
  .appitem.active{color:var(--accent);}
  .admin-only{display:none;}
  body.is-admin .admin-only{display:flex;}
  @media (min-width:760px){
    :root{--nav-h:0px;}
    .appnav{position:static;display:inline-flex;background:var(--card-2);border:1px solid var(--border);
      border-top:1px solid var(--border);border-radius:10px;padding:3px;box-shadow:none;gap:2px;
      margin:0 0 12px;}
    .appitem{flex:0 0 auto;flex-direction:row;gap:7px;min-height:auto;padding:7px 14px;font-size:12.5px;
      border-radius:8px;}
    .appitem .ic{width:15px;height:15px;}
    .appitem.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
    .wrap{padding-bottom:120px;}
    .fab{bottom:26px;}
    .topbar .btn.desktop-only{display:inline-flex;}
  }
  .desktop-only{display:none;}
  @media (min-width:760px){.desktop-only{display:inline-flex;}}

  /* dropzone overlay */
  #dz{position:fixed;inset:10px;z-index:100;border:2.5px dashed var(--accent);border-radius:18px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:none;}
  #dz.on{display:flex;}
  #dz .ic{width:52px;height:52px;color:var(--accent);stroke-width:1.4;}
  #dz b{font-size:18px;color:var(--ink);}

  /* upload tray */
  #tray{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 12px);
    z-index:65;max-width:430px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;}
  #tray.on{display:block;}
  .tray-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
  .tray-head b{flex:1;font-size:13px;color:var(--ink);}
  .tray-head .iconbtn{width:30px;height:30px;}
  .tray-items{max-height:240px;overflow-y:auto;}
  .titem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
  .titem:last-child{border-bottom:none;}
  .titem .tnm{flex:1;min-width:0;}
  .titem .tnm b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .titem .tst{font-size:11px;color:var(--muted);}
  .titem .tst.err{color:var(--bad);}
  .titem .tst.ok{color:var(--good);}
  .tbar{height:4px;border-radius:2px;background:var(--card-2);margin-top:5px;overflow:hidden;}
  .tbar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .25s;}
  .titem .iconbtn{width:30px;height:30px;flex:0 0 auto;}

  /* preview overlay */
  #view{position:fixed;inset:0;z-index:110;background:rgba(10,10,10,.92);display:none;flex-direction:column;}
  #view.on{display:flex;}
  .view-top{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;color:#fff;}
  .view-top b{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .view-top .iconbtn{color:rgba(255,255,255,.85);}
  .view-top .iconbtn:hover{background:rgba(255,255,255,.12);color:#fff;}
  .view-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:0 0 18px;}
  .view-body img,.view-body video{max-width:100%;max-height:100%;object-fit:contain;}
  .view-other{text-align:center;color:#fff;}
  .view-other .ic{width:56px;height:56px;margin:0 auto 14px;stroke-width:1.3;color:rgba(255,255,255,.8);}
  .vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:flex;
    align-items:center;justify-content:center;color:rgba(255,255,255,.8);}
  .vnav:hover{color:#fff;}
  .vnav.prev{left:4px;} .vnav.next{right:4px;}
  .vnav .ic{width:26px;height:26px;stroke-width:2.4;}

  /* google drive sheet */
  #gdsheet{position:fixed;left:0;right:0;bottom:0;z-index:118;background:var(--card);
    border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;
    transform:translateY(105%);transition:transform .28s var(--ease);max-height:75vh;
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
  #gdsheet.open{transform:none;}
  .gd-head{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .gd-head b{flex:1;font-size:15px;color:var(--ink);}
  #gdBody{overflow-y:auto;padding:4px 16px 20px;}
  .gd-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .gd-row:last-child{border-bottom:none;}
  .gd-row .ic{width:18px;height:18px;color:var(--muted);flex:0 0 auto;}
  .gd-row.dir .ic{color:var(--accent);}
  .gd-row .nm{flex:1;min-width:0;color:var(--ink);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gd-row small{color:var(--muted);flex:0 0 auto;}
  .gd-imp{font-size:12px;font-weight:650;border:1px solid var(--border);border-radius:7px;
    padding:5px 11px;color:var(--accent);}
  .gd-imp:hover{background:var(--accent-bg);}
  .gd-imp:disabled{opacity:.45;}
  @media (min-width:760px){
    #gdsheet{left:50%;right:auto;bottom:50%;transform:translate(-50%,60%) scale(.97);opacity:0;
      width:min(520px,92vw);border-radius:14px;border-bottom:1px solid var(--border);pointer-events:none;
      transition:transform .25s var(--ease), opacity .18s;}
    #gdsheet.open{transform:translate(-50%,50%) scale(1);opacity:1;pointer-events:auto;}
  }

  /* selection + move */
  .card{position:relative;}
  .pick{position:absolute;left:8px;top:8px;z-index:3;width:24px;height:24px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;cursor:pointer;padding:0;}
  body.picking .pick{display:flex;}
  .pick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;opacity:0;}
  .card.on .pick{background:var(--accent);border-color:var(--accent);}
  .card.on .pick svg{opacity:1;}
  .card.on{outline:2px solid var(--accent);outline-offset:-2px;}
  .folder.dragover{outline:2px dashed var(--accent);outline-offset:-2px;}
  .actbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:90;display:none;align-items:center;gap:10px;padding:9px 12px;border-radius:999px;
    background:#171717;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13.5px;
    max-width:calc(100vw - 24px);flex-wrap:nowrap;overflow:auto;}
  .actbar.on{display:flex;}
  .actbar b{font-weight:650;white-space:nowrap;}
  .actbar button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;
    border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:650;
    cursor:pointer;white-space:nowrap;}
  .actbar button.primary{background:#fff;color:#171717;border-color:#fff;}
  /* organize sheet */
  #orgsheet{position:fixed;left:0;right:0;bottom:0;z-index:118;background:var(--card);
    border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;
    transform:translateY(105%);transition:transform .28s var(--ease);max-height:80vh;
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
  #orgsheet.open{transform:none;}
  #orgBody{overflow-y:auto;padding:8px 16px;}
  .org-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0));
    border-top:1px solid var(--border);}
  .org-g{padding:10px 0;border-bottom:1px solid var(--border);}
  .org-g:last-child{border-bottom:none;}
  .org-g input{font:inherit;font-weight:650;color:var(--ink);background:var(--bg);
    border:1px solid var(--border);border-radius:7px;padding:6px 10px;width:min(240px,60%);}
  .org-g small{color:var(--muted);margin-left:8px;}
  .org-thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;}
  .org-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:0 0 auto;
    cursor:pointer;border:2px solid transparent;transition:border-color .12s,opacity .12s;}
  .org-thumbs img.picked{border-color:var(--accent);}
  .org-thumbs img.dropped{opacity:.32;}
  .org-note{font-size:12px;color:var(--muted);margin-top:6px;}
  .org-move{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .org-move select{font:inherit;font-size:12.5px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);color:var(--ink);padding:5px 8px;}
  .org-move button{font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;
    border:1px solid var(--border);border-radius:8px;background:var(--bg);
    color:var(--ink);padding:5px 10px;}
  .org-move button:disabled{opacity:.45;cursor:default;}
  @media (min-width:760px){
    #orgsheet{left:50%;right:auto;bottom:50%;transform:translate(-50%,60%) scale(.97);opacity:0;
      width:min(560px,92vw);border-radius:14px;border-bottom:1px solid var(--border);pointer-events:none;
      transition:transform .25s var(--ease), opacity .18s;}
    #orgsheet.open{transform:translate(-50%,50%) scale(1);opacity:1;pointer-events:auto;}
  }

  /* menu + modal + toast */
  #menu{position:fixed;z-index:120;background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:5px;min-width:190px;display:none;
    max-height:min(360px,80vh);overflow-y:auto;}
  #menu.on{display:block;}
  #menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;
    font-size:13.5px;font-weight:550;color:var(--ink);text-align:left;}
  #menu button:hover{background:var(--card-2);}
  #menu button.danger{color:var(--bad);}
  #menu button.danger:hover{background:var(--bad-bg);}
  #menu .ic{width:16px;height:16px;}
  #infobox{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:130;display:flex;align-items:center;justify-content:center;padding:16px;}
  .ibx{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:430px;width:100%;padding:16px 18px;box-shadow:var(--shadow-lg);}

   button is desktop-only). Its correct rule places it above the 60px bottom

<script>
'use strict';
const API = '/drop/api';
const FILES = '/drop/files';
const CHUNK = 6 * 1024 * 1024;

let state = { path: '', dirs: [], files: [], view: localStorage.getItem('drop_view') || 'grid', filter: '', sort: localStorage.getItem('drop_sort') || 'new', cat: 'all' };
let uploads = [];       // {file, path, id, sent, size, status, err}
let uploading = false;
let viewIdx = -1;       // index into visible files for the preview overlay
let picking = false;                 // multi-select mode
let sel = new Set();                 // filenames ticked in the current folder
let clip = { names: [], from: null }; // files cut, waiting for a destination

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtSize(n){
  if(n >= 1e9) return (n/1e9).toFixed(1) + ' GB';
  if(n >= 1e6) return (n/1e6).toFixed(1) + ' MB';
  if(n >= 1e3) return Math.round(n/1e3) + ' KB';
  return n + ' B';
}
function fmtDate(ts){
  const d = new Date(ts * 1000), now = new Date();
  const days = Math.floor((now - d) / 864e5);
  if(days === 0) return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(days === 1) return 'yesterday';
  if(days < 7) return days + 'd ago';
  return d.toLocaleDateString([], {day:'numeric', month:'short'});
}
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
async function api(path, opts){
  const res = await fetch(API + path, opts);
  if(res.redirected || res.status === 401){ location.href = '/oauth2/start?rd=/drop/'; throw new Error('auth'); }
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw Object.assign(new Error(data.error || 'request failed'), {status: res.status, data});
  return data;
}
function encPath(rel){ return rel.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }
function fileURL(name){
  const rel = state.path ? state.path + '/' + name : name;
  return FILES + '/' + encPath(rel);
}

/* ---------------- icons ---------------- */
const ICONS = {
  folder: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  image: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>',
  video: '<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="M17 10l5-3v10l-5-3z"/></svg>',
  audio: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>',
  doc: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>',
  archive: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M12 8h3M12 12h3M12 16h3" /></svg>',
  file: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg>',
  dots: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>',
  dl: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/></svg>',
  edit: '<svg class="ic" viewBox="0 0 24 24"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg>',
  trash: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13"/></svg>',
  up: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>',
};

/* ---------------- navigation + rendering ---------------- */
function nav(path){
  location.hash = '#/' + encPath(path);
}
window.addEventListener('hashchange', () => load());

async function load(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  state.path = raw.replace(/^\/+|\/+$/g, '');
  $('grid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('folders').innerHTML = '';
  try {
    const data = await api('/list?path=' + encodeURIComponent(state.path));
    state.dirs = data.dirs; state.files = data.files;
    $('freenote').textContent = data.free_gb + ' GB free on the server';
    render();
  } catch(e) {
    if(e.status === 404 && state.path){ nav(''); return; }
    $('grid').innerHTML = '<div class="empty"><h3>Could not load</h3><p>' + esc(e.message) + '</p></div>';
  }
}

function crumbs(){
  const parts = state.path ? state.path.split('/') : [];
  let html = '<button class="crumb' + (parts.length ? '' : ' here') + '" data-p="">Drop</button>';
  let acc = [];
  parts.forEach((p, i) => {
    acc.push(p);
    const here = i === parts.length - 1;
    html += '<span class="crumb-sep">/</span><button class="crumb' + (here ? ' here' : '') +
            '" data-p="' + esc(acc.join('/')) + '">' + esc(p) + '</button>';
  });
  $('crumbs').innerHTML = html;
  $('crumbs').querySelectorAll('.crumb').forEach(b => b.onclick = () => nav(b.dataset.p));
}

const SORTS = {new:'Newest first', old:'Oldest first', name:'Name (A–Z)', size:'Largest first', type:'File type'};
function visibleFiles(){
  let f = state.files.slice();
  const q = state.filter.toLowerCase();
  if(q) f = f.filter(x => x.name.toLowerCase().includes(q));
  if(state.cat !== 'all') f = f.filter(x => x.kind === state.cat);
  const s = state.sort;
  f.sort((a, b) =>
    s === 'old'  ? a.mtime - b.mtime :
    s === 'name' ? a.name.localeCompare(b.name, undefined, {numeric:true}) :
    s === 'size' ? b.size - a.size :
    s === 'type' ? (a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name)) :
                   b.mtime - a.mtime);   // 'new' default
  return f;
}
const CATS = [
  {k:'all', label:'All', icon:''},
  {k:'image', label:'Photos', icon:'image'},
  {k:'video', label:'Videos', icon:'video'},
  {k:'doc', label:'Docs', icon:'doc'},
  {k:'audio', label:'Audio', icon:'audio'},
  {k:'archive', label:'Archives', icon:'archive'},
  {k:'file', label:'Other', icon:'file'},
];
function buildCatbar(){
  const counts = {};
  state.files.forEach(f => { counts[f.kind] = (counts[f.kind] || 0) + 1; });
  const present = CATS.filter(c => c.k === 'all' || counts[c.k]);
  if(present.length <= 2){ $('catbar').innerHTML = ''; state.cat = 'all'; return; }
  $('catbar').innerHTML = present.map(c => {
    const n = c.k === 'all' ? state.files.length : counts[c.k];
    return '<button class="cat' + (state.cat === c.k ? ' on' : '') + '" data-k="' + c.k + '">' +
      (c.icon ? ICONS[c.icon] : '') + c.label + ' <small>' + n + '</small></button>';
  }).join('');
  $('catbar').querySelectorAll('.cat').forEach(b => b.onclick = () => {
    state.cat = b.dataset.k; render();
  });
}
function showSortMenu(e){
  const m = $('menu');
  m.innerHTML = Object.entries(SORTS).map(([k, label]) =>
    '<button data-s="' + k + '">' + (state.sort === k ? '● ' : '<span style="opacity:.3">○ </span>') + label + '</button>'
  ).join('');
  m.classList.add('on'); $('veil').classList.add('on');
  const r = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 200) + 'px';
  m.style.top = (r.bottom + 6) + 'px';
  m.querySelectorAll('button').forEach(b => b.onclick = () => {
    state.sort = b.dataset.s; localStorage.setItem('drop_sort', state.sort);
    hideMenu(); render();
  });
}

function render(){
  crumbs();
  document.body.classList.toggle('list', state.view === 'list');
  $('viewIcGrid').style.display = state.view === 'grid' ? '' : 'none';
  $('viewIcList').style.display = state.view === 'list' ? '' : 'none';

  buildCatbar();
  const q = state.filter.toLowerCase();
  const showFolders = state.cat === 'all';
  const dirs = !showFolders ? [] : (q ? state.dirs.filter(d => d.name.toLowerCase().includes(q)) : state.dirs);
  $('folders').style.display = dirs.length ? '' : 'none';
  $('folders').innerHTML = dirs.map(d =>
    '<div class="folder" data-n="' + esc(d.name) + '">' + ICONS.folder +
    '<b>' + esc(d.name) + '</b><small>' + d.count + '</small>' +
    '<button class="fdots" data-n="' + esc(d.name) + '" aria-label="Folder options">' + ICONS.dots + '</button></div>'
  ).join('');
  $('folders').querySelectorAll('.folder').forEach(b => {
    b.onclick = e => { if(e.target.closest('.fdots')) return; nav(state.path ? state.path + '/' + b.dataset.n : b.dataset.n); };
    b.oncontextmenu = e => { e.preventDefault(); showMenu(e, b.dataset.n, true); };
    /* Dropping onto a folder is the desktop shortcut for the same move the
       Move…/Move here buttons do — those stay the phone path, where dragging
       across a scrolling grid is unpleasant. */
    b.addEventListener('dragover', e => {
      if(!e.dataTransfer.types.includes('application/x-drop-files')) return;
      e.preventDefault(); b.classList.add('dragover');
    });
    b.addEventListener('dragleave', () => b.classList.remove('dragover'));
    b.addEventListener('drop', async e => {
      b.classList.remove('dragover');
      let names = [];
      try { names = JSON.parse(e.dataTransfer.getData('application/x-drop-files') || '[]'); } catch(_){}
      if(!names.length) return;
      e.preventDefault(); e.stopPropagation();
      await moveTo(names, state.path, state.path ? state.path + '/' + b.dataset.n : b.dataset.n);
    });
  });
  $('folders').querySelectorAll('.fdots').forEach(b => {
    b.onclick = e => { e.stopPropagation(); showMenu(e, b.dataset.n, true); };
  });

  const files = visibleFiles();
  if(!files.length && !dirs.length){
    const catLabel = (CATS.find(c => c.k === state.cat) || {}).label || '';
    $('grid').innerHTML =
      '<div class="empty" style="grid-column:1/-1">' + ICONS.up +
      '<h3>' + (q || state.cat !== 'all' ? 'No matches' : 'Nothing here yet') + '</h3>' +
      '<p>' + (state.cat !== 'all' ? 'No ' + catLabel.toLowerCase() + ' in this folder.'
             : q ? 'Try a different search.'
             : 'Drag files anywhere on this page, or tap Upload.') + '</p></div>';
    return;
  }
  $('grid').innerHTML = files.map((f, i) => {
    const pv = f.thumb

/* ---------------- uploads (chunked + resumable) ---------------- */
function trayRender(){
  const active = uploads.filter(u => u.status !== 'done' || Date.now() - u.doneAt < 4000);
  $('tray').classList.toggle('on', active.length > 0);
  const doneN = uploads.filter(u => u.status === 'done').length;
  $('trayTitle').textContent = uploading
    ? 'Uploading ' + (doneN + 1) + ' of ' + uploads.length + '…'
    : 'Uploaded ' + doneN + ' file' + (doneN === 1 ? '' : 's');
  $('trayItems').innerHTML = active.map((u, i) => {
    const pct = u.size ? Math.floor(100 * u.sent / u.size) : 0;
    let st, cls = '';
    if(u.status === 'done'){ st = 'Done'; cls = 'ok'; }
    else if(u.status === 'error'){ st = (u.err || 'Failed') + ' — retrying…'; cls = 'err'; }
    else if(u.status === 'waiting'){ st = 'Waiting…'; }
    else { st = pct + '% · ' + fmtSize(u.sent) + ' of ' + fmtSize(u.size); }
    return '<div class="titem"><div class="tnm"><b>' + esc(u.file.name) + '</b>' +
      '<span class="tst ' + cls + '">' + st + '</span>' +
      '<div class="tbar"><i style="width:' + pct + '%"></i></div></div>' +
      (u.status !== 'done' ? '<button class="iconbtn" data-i="' + uploads.indexOf(u) + '" aria-label="Cancel">✕</button>' : '') +
      '</div>';
  }).join('');
  $('trayItems').querySelectorAll('button[data-i]').forEach(b => {
    b.onclick = () => { uploads[parseInt(b.dataset.i, 10)].cancelled = true; };
  });
}
$('trayClose').onclick = () => $('tray').classList.remove('on');

function queueFiles(fileList){
  const files = [...fileList].filter(f => f.size >= 0);
  if(!files.length) return;
  for(const f of files){
    if(f.size > 4e9){ toast(f.name + ' is over the 4 GB limit'); continue; }
    uploads.push({file: f, path: state.path, sent: 0, size: f.size, status: 'waiting'});
  }
  trayRender();
  if(!uploading) pump();
}

async function pump(){
  uploading = true;
  for(const u of uploads){
    if(u.status !== 'waiting') continue;
    await uploadOne(u);
  }
  uploading = false;
  trayRender();
  load();
}

async function uploadOne(u){
  u.status = 'uploading';
  let backoff = 1000;
  while(!u.cancelled){
    try {
      const init = await api('/upload/init', {method: 'POST', body: JSON.stringify({
        path: u.path, name: u.file.name, size: u.size,
        mtime: Math.floor((u.file.lastModified || 0) / 1000),
      })});
      u.id = init.id;
      u.sent = init.offset;
      if(init.offset > 0 && !u.resumedShown){
        u.resumedShown = true;
        toast('Resuming ' + u.file.name + ' at ' + Math.floor(100 * init.offset / u.size) + '%');
      }
      while(u.sent < u.size && !u.cancelled){
        const end = Math.min(u.sent + CHUNK, u.size);
        const blob = u.file.slice(u.sent, end);
        const res = await fetch(API + '/upload/chunk?id=' + u.id + '&offset=' + u.sent,
                                {method: 'PUT', body: blob});
        const data = await res.json().catch(() => ({}));
        if(res.status === 409 && typeof data.offset === 'number'){ u.sent = data.offset; continue; }
        if(!res.ok) throw new Error(data.error || 'chunk failed');
        u.sent = data.offset;
        u.status = 'uploading';
        backoff = 1000;
        trayRender();
      }
      if(u.cancelled) return;
      const fin = await api('/upload/finish', {method: 'POST', body: JSON.stringify({id: u.id})});
      u.status = 'done';
      u.doneAt = Date.now();
      trayRender();
      return;
    } catch(e){
      if(u.cancelled) return;
      u.status = 'error';
      u.err = /failed to fetch|network/i.test(e.message) ? 'Connection lost' : e.message;
      trayRender();
      await new Promise(r => setTimeout(r, backoff));
      backoff = Math.min(backoff * 2, 15000);
      u.status = 'uploading';
    }
  }
}

    setPicking(false);
    load();
  } catch(e){ toast(e.message); }
}
$('pickBtn').onclick = () => setPicking(!picking);
$('actClear').onclick = () => setPicking(false);
$('actCut').onclick = () => {
  if(!sel.size) return;
  clip = { names: Array.from(sel), from: state.path };
  toast('Now open the folder you want them in');
  drawActbar();
};
$('clipCancel').onclick = () => { clip = { names: [], from: null }; setPicking(false); };
$('clipPaste').onclick = () => moveTo(clip.names, clip.from, state.path);

/* ---------------- Organize ---------------- */
let orgGroups = [];
function orgClose(){ $('orgsheet').classList.remove('open'); $('veil').classList.remove('on'); }
$('orgClose').onclick = orgClose;
$('orgCancel').onclick = orgClose;
$('orgBtn').onclick = async () => {
  toast('Scanning photos for similar products…');
  try {
    const r = await api('/organize/scan', {method:'POST', body: JSON.stringify({path: state.path})});
    if(!r.groups || !r.groups.length){
      toast(r.note || 'No similar-photo groups found here');
      return;
    }
    orgGroups = r.groups;
    orgDrop = {};
    orgRender(r.ungrouped);
    $('orgsheet').classList.add('open');
    $('veil').classList.add('on');
  } catch(e){ toast(e.message); }
};
/* Grouping by image similarity gets most photos right and some wrong, and
   the wrong ones are obvious to a person in a second. Tap a photo to take it
   out; tap it again to put it back; or pick several and move them to another
   set. Nothing is filed until Apply, so this is all still a proposal. */
let orgDrop = {};        // "groupIndex:filename" -> excluded from the run
let orgPick = {};        // "groupIndex:filename" -> ticked for a move

function orgKey(i, f){ return i + ':' + f; }

function orgRender(ungrouped){
  const opts = orgGroups.map((g, i) =>
    '<option value="' + i + '">' + esc(g.name) + '</option>').join('');
  $('orgBody').innerHTML = orgGroups.map((g, i) => {
    const live = g.files.filter(f => !orgDrop[orgKey(i, f)]);
    return '<div class="org-g" data-g="' + i + '">' +
      '<input value="' + esc(g.name) + '" data-i="' + i + '" aria-label="Folder name">' +
      '<small>' + live.length + ' photo' + (live.length === 1 ? '' : 's') + '</small>' +
      '<div class="org-thumbs">' + g.files.map(f =>
        '<img loading="lazy" data-f="' + esc(f) + '" title="' + esc(f) + '" class="' +
        (orgDrop[orgKey(i, f)] ? 'dropped' : '') +
        (orgPick[orgKey(i, f)] ? ' picked' : '') + '" src="' + API + '/thumb?path=' +
        encodeURIComponent((state.path ? state.path + '/' : '') + f) + '">').join('') +
      '</div>' +
      '<div class="org-move">' +
        '<span class="org-note">Tap a photo to leave it out. Or pick some and</span>' +
        '<select data-to="' + i + '">' + opts + '</select>' +
        '<button data-move="' + i + '" disabled>Move</button>' +
      '</div></div>';
  }).join('') +
  '<p class="freenote">' + ungrouped + ' photos had no close match and stay where they are. ' +
  'Names are editable; files are only moved when you apply.</p>';

  $('orgBody').querySelectorAll('.org-thumbs img').forEach(img => {
    const gi = +img.closest('.org-g').dataset.g, f = img.dataset.f, k = orgKey(gi, f);
    img.onclick = e => {
      if(e.shiftKey || e.metaKey || e.ctrlKey){
        orgPick[k] = !orgPick[k];
      } else {
        orgDrop[k] = !orgDrop[k];
        if(orgDrop[k]) delete orgPick[k];
      }
      orgRender(ungrouped);
    };
    img.ondblclick = () => { orgPick[k] = !orgPick[k]; orgRender(ungrouped); };
  });
  $('orgBody').querySelectorAll('[data-move]').forEach(b => {
    const from = +b.dataset.move;
    const picked = orgGroups[from].files.filter(f => orgPick[orgKey(from, f)]);
    b.disabled = !picked.length;
    b.textContent = picked.length ? 'Move ' + picked.length : 'Move';
    b.onclick = () => {
      const to = +b.closest('.org-g').querySelector('select').value;
      if(to === from) return;
      picked.forEach(f => {
        orgGroups[from].files = orgGroups[from].files.filter(x => x !== f);
        orgGroups[to].files.push(f);
        delete orgPick[orgKey(from, f)];
        delete orgDrop[orgKey(from, f)];
      });
      orgRender(ungrouped);
      toast('Moved ' + picked.length + ' to ' + orgGroups[to].name);
    };
  });
}

$('orgApply').onclick = async () => {
  $('orgBody').querySelectorAll('input[data-i]').forEach(inp => {
    orgGroups[+inp.dataset.i].name = inp.value.trim() || orgGroups[+inp.dataset.i].name;
  });
  /* Photos tapped out stay where they are; a set emptied that way isn't a
     folder worth creating. */
  const send = orgGroups
    .map((g, i) => ({name: g.name, files: g.files.filter(f => !orgDrop[orgKey(i, f)])}))
    .filter(g => g.files.length);
  if(!send.length){ toast('Nothing left to file'); return; }
  $('orgApply').disabled = true;
  try {
    const r = await api('/organize/apply', {method:'POST', body: JSON.stringify({path: state.path, groups: send})});
    orgClose();
    toast('Moved ' + r.moved + ' photos into ' + r.folders.length + ' folder' + (r.folders.length === 1 ? '' : 's'));
    load();
  } catch(e){ toast(e.message); }
  $('orgApply').disabled = false;
};

/* ---------------- Google Drive ---------------- */
let gdStack = [];   // [{id, name}]
function gdOpenSheet(){ $('gdsheet').classList.add('open'); $('veil').classList.add('on'); }
function gdCloseSheet(){ $('gdsheet').classList.remove('open'); $('veil').classList.remove('on'); }
$('gdClose').onclick = gdCloseSheet;
$('gdBack').onclick = () => { gdStack.pop(); gdList(); };
$('gdReconnect').onclick = () => {
  if(confirm('Reconnect Google Drive?\n\nYou will be sent to Google to re-approve. This grants Drop permission to SAVE files to your Drive (needed for "Save to Drive" and "Sync to Drive"), on top of importing.')){
    location.href = API + '/gdrive/connect';
  }
};
$('gdBtn').onclick = async () => {
  try {
    const st = await api('/gdrive/status');
    if(!st.connected){
      if(confirm('Connect the Timelabs Google Drive?\n\nYou will be sent to Google to approve reading your Drive (to import) and saving files to it (to export).')){
        location.href = API + '/gdrive/connect';
      }
      return;
    }
    gdStack = [];
    gdOpenSheet();
    gdList();
  } catch(e){ toast(e.message); }
};
async function gdList(){
  const cur = gdStack[gdStack.length - 1];
  $('gdBack').style.display = gdStack.length ? '' : 'none';
  $('gdBody').innerHTML = '<p class="empty" style="padding:14px">Loading…</p>';
  try {
    const data = await api('/gdrive/list?folder=' + (cur ? cur.id : 'root'));
    if(!data.items.length){ $('gdBody').innerHTML = '<p class="empty" style="padding:14px">Empty folder.</p>'; return; }
    $('gdBody').innerHTML = data.items.map((f, i) => {
      let right;
      if(f.dir) right = '<small>›</small>';
      else if(f.importable) right = (f.size ? '<small>' + fmtSize(f.size) + '</small>' : '') +
             '<button class="gd-imp" data-i="' + i + '">Import' + (f.as ? ' as ' + f.as : '') + '</button>';
      else right = '<small>can’t import</small>';
      return '<div class="gd-row' + (f.dir ? ' dir' : '') + '" data-i="' + i + '">' +
        (f.dir ? ICONS.folder : ICONS[f.gdoc ? 'doc' : 'file']) +
        '<span class="nm">' + esc(f.name) + '</span>' + right + '</div>';
    }).join('');
    $('gdBody').querySelectorAll('.gd-row.dir').forEach(r => {
      r.onclick = () => { const f = data.items[+r.dataset.i]; gdStack.push({id: f.id, name: f.name}); gdList(); };
    });
    $('gdBody').querySelectorAll('.gd-imp').forEach(b => {
      b.onclick = async (e) => {
        e.stopPropagation();
        const f = data.items[+b.dataset.i];
        b.disabled = true; b.textContent = 'Importing…';
        try {
          await api('/gdrive/import', {method:'POST', body: JSON.stringify({id: f.id, name: f.name, mime: f.mime, path: state.path})});
          toast(f.name + ' is importing — it will appear here shortly');
          b.textContent = 'Queued ✓';
          setTimeout(load, 4000);
        } catch(err){ toast(err.message); b.disabled = false; b.textContent = 'Import'; }
      };
    });
  } catch(e){
    $('gdBody').innerHTML = '<p class="empty" style="padding:14px">' + esc(e.message) +
      (e.status === 401 ? ' — <a href="' + API + '/gdrive/connect">reconnect</a>' : '') + '</p>';
  }
}

/* admin chip for Key nav */
(async () => {
  try {
    const res = await fetch('/ops/agent/api/whoami');
    if(res.ok){ const i = await res.json(); if(i.admin) document.body.classList.add('is-admin'); }
  } catch(e){}
})();

load();
</script>
