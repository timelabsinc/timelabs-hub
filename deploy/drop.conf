# Timelabs Drop — copyparty file/video tunnel.
# Binds localhost ONLY; nginx (behind Key / oauth2-proxy auth_request) is the
# gate, so there is no second login. Resumable chunked uploads (up2k) are on by
# default — a dropped mobile connection resumes instead of restarting.

[global]
  i: 127.0.0.1          # bind loopback only — not directly reachable
  p: 3923               # copyparty default port
  e2dsa                 # index files (search, dedupe)
  e2ts                  # media tags + thumbnails (Pillow for images, ffmpeg for video)
  no-robots             # don't get indexed by crawlers
  name: Timelabs Drop
  grid                  # gallery/grid view by default — good for product videos
  rp-loc: drop          # served under /drop/ behind nginx
  xff-src: 127.0.0.0/8  # trust X-Forwarded-* only from the local proxy
  theme: 1              # bright base; the Meridian skin restyles both schemes
  css-browser: /ops/drop.css   # Meridian skin (served by nginx, same auth)

[/]                     # served at the root of copyparty
  /root/ops-dashboard/data/drop
  accs:
    rwmd: *             # anonymous = full team access (read/write/move/delete),
                        # because every visitor already passed Key at nginx.
